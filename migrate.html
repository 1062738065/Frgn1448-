<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نسخ بيانات التجريبي إلى الحقيقي</title>
<style>
  :root{--bg:#F2ECE8;--fg:#2a1a1f;--p:#6b2337;--card:#fff;--ok:#1d7a46;--bad:#b3261e;--line:#e2d6d0}
  @media (prefers-color-scheme:dark){:root{--bg:#1d1517;--fg:#f3e9e6;--card:#2a1f22;--line:#44343a;--p:#d98aa0}}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.7}
  main{max-width:640px;margin:0 auto;padding:20px 16px 60px}
  h1{font-size:1.3rem;margin:.2em 0 .4em}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
  label.row{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
  label.row:last-child{border:0}
  label.row small{display:block;opacity:.7}
  input[type=checkbox]{width:22px;height:22px;margin-top:4px;accent-color:var(--p)}
  button{font:inherit;border:0;border-radius:12px;padding:12px 18px;margin:6px 6px 0 0;background:var(--p);color:#fff;cursor:pointer;min-height:44px}
  button.alt{background:transparent;color:var(--p);border:1.5px solid var(--p)}
  button:disabled{opacity:.5}
  .log div{padding:4px 0;border-bottom:1px dashed var(--line)}
  .ok{color:var(--ok)}.bad{color:var(--bad)}
  .note{font-size:.92rem;opacity:.85}
</style>
</head>
<body>
<main>
  <h1>نسخ بيانات التجريبي إلى الحقيقي</h1>
  <div class="card note">
    الأداة تقرأ من القاعدة التجريبية وتضيف للحقيقية <b>الصفوف الناقصة فقط</b>.
    أي صف موجود عندك في الحقيقي بنفس المعرّف <b>يبقى كما هو ولا يتغير</b>، ولا يُحذف شيء أبدًا.
    شغّلي ملف SQL أولًا (01-upgrade-real-db.sql) ثم هذه الصفحة.
  </div>

  <div class="card" id="list"></div>

  <button id="check" class="alt">١) فحص فقط (بدون نسخ)</button>
  <button id="run">٢) ابدأ النسخ</button>

  <div class="card log" id="log" aria-live="polite">لم يبدأ شيء بعد.</div>
</main>

<script>
const SRC = {url:"https://apgjeohiworbtatagxbn.supabase.co", key:"sb_publishable_AsbCJxBM7C_wLqaBQ2WsDw_1xIxJ3kb"};
const DST = {url:"https://bamirxxstfmgmscwylkg.supabase.co", key:"sb_publishable_f2BGuOJ4vs02gzMPdaP3rQ_PpcZGl1m"};

// الجدول، المفتاح الأساسي، الاسم بالعربي، مفعّل افتراضيًا؟، ملاحظة
const TABLES = [
  ["roles","id","الأدوار",true,""],
  ["persons","id","الأشخاص",true,"مرتبطون بالأدوار"],
  ["approval_paths","id","مسارات الاعتماد",true,""],
  ["report_tabs","id","تبويبات التقارير",true,""],
  ["dashboard_config","id","إعدادات لوحة المعلومات",true,""],
  ["section_field_schemas","section_id","حقول أقسام التقرير",true,""],
  ["job_title_templates","id","قوالب المسميات الوظيفية",true,""],
  ["org_chart","id","الهيكل التنظيمي",true,""],
  ["platform_users","id","الحسابات الإضافية",true,""],
  ["report_sections","id","أقسام التقرير",true,"الناقص فقط"],
  ["goals_definitions","id","تعريفات الأهداف",true,"الناقص فقط"],
  ["indicator_definitions","id","تعريفات المؤشرات",true,"الناقص فقط"],
  ["units","id","الوحدات (وكلمات سرها)",false,"غالبًا لا تحتاجينها"],
  ["departments","id","الأقسام (وكلمات سرها)",false,"غالبًا لا تحتاجينها"],
  ["offices","id","مكاتب الإشراف",false,"غالبًا لا تحتاجينها"],
  ["reports","id","التقارير التجريبية",false,"بيانات تجربة"],
  ["permission_log","id","سجل الصلاحيات",false,""],
  ["site_settings","id","إعدادات شكل الموقع",false,"عندك إعداداتك أصلًا"]
];

const $ = id => document.getElementById(id);
$("list").innerHTML = TABLES.map(([t,,ar,on,note]) =>
  `<label class="row"><input type="checkbox" data-t="${t}" ${on?"checked":""}><span>${ar}<small>${note}</small></span></label>`).join("");

function logLine(html, cls){ const d=document.createElement("div"); if(cls) d.className=cls; d.innerHTML=html; $("log").appendChild(d); }

async function readAll(table){
  const out=[]; let from=0; const step=1000;
  for(;;){
    const r = await fetch(`${SRC.url}/rest/v1/${table}?select=*`, {
      headers:{apikey:SRC.key, Authorization:"Bearer "+SRC.key, Range:`${from}-${from+step-1}`, "Range-Unit":"items"}});
    if(!r.ok) throw new Error(`قراءة ${table}: ${r.status} ${(await r.text()).slice(0,160)}`);
    const rows = await r.json(); out.push(...rows);
    if(rows.length < step) break; from += step;
  }
  return out;
}

async function writeMissing(table, pk, rows){
  for(let i=0;i<rows.length;i+=200){
    const chunk = rows.slice(i,i+200);
    const r = await fetch(`${DST.url}/rest/v1/${table}?on_conflict=${pk}`, {
      method:"POST",
      headers:{apikey:DST.key, Authorization:"Bearer "+DST.key, "Content-Type":"application/json",
               Prefer:"resolution=ignore-duplicates,return=minimal"},
      body:JSON.stringify(chunk)});
    if(!r.ok) throw new Error(`كتابة ${table}: ${r.status} ${(await r.text()).slice(0,200)}`);
  }
}

async function go(doWrite){
  $("check").disabled = $("run").disabled = true;
  $("log").innerHTML = "";
  const chosen = [...document.querySelectorAll("input[data-t]:checked")].map(x=>x.dataset.t);
  if(!chosen.length){ logLine("اختاري جدولًا واحدًا على الأقل.","bad"); $("check").disabled=$("run").disabled=false; return; }
  let failed = 0;
  for(const [t,pk,ar] of TABLES){
    if(!chosen.includes(t)) continue;
    try{
      const rows = await readAll(t);
      if(!doWrite){ logLine(`${ar}: ${rows.length} صف في التجريبي`); continue; }
      if(rows.length) await writeMissing(t,pk,rows);
      logLine(`✓ ${ar}: تمت معالجة ${rows.length} صف (الموجود منها عندك لم يتغير)`,"ok");
    }catch(e){ failed++; logLine(`✗ ${ar}: ${e.message}`,"bad"); }
  }
  logLine(failed ? `انتهى مع ${failed} خطأ. إن ظهر خطأ عن عمود غير موجود فشغّلي ملف SQL أولًا ثم أعيدي.` : (doWrite ? "انتهى بنجاح." : "انتهى الفحص."), failed?"bad":"ok");
  $("check").disabled=$("run").disabled=false;
}
$("check").onclick = () => go(false);
$("run").onclick = () => go(true);
</script>
</body>
</html>
